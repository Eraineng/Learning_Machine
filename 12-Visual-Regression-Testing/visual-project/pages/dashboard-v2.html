<!DOCTYPE html>
<!-- "v2" — a developer made small CSS changes. Two of them are UNINTENDED regressions.
     Can you spot them by eye? A visual test finds them instantly.
     (1) button colour changed to green, (2) card padding shrank, shifting the layout. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Dashboard v2</title>
  <style>
    :root { --brand: #0b5fff; --text: #1a1a1a; --muted: #5a6472; --card: #ffffff; --bg: #f4f6fa; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: var(--bg); color: var(--text); }
    header { background: var(--brand); color: #fff; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 20px; margin: 0; }
    .container { padding: 24px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .card { background: var(--card); border: 1px solid #e2e6ee; border-radius: 8px; padding: 8px; }  /* ← regression 2 */
    .card h2 { font-size: 14px; color: var(--muted); margin: 0 0 8px; text-transform: uppercase; letter-spacing: .04em; }
    .value { font-size: 28px; font-weight: bold; }
    .cta { margin: 0 24px 24px; }
    button { background: #1e9e5a; color: #fff; border: 0; border-radius: 6px; padding: 10px 18px; font-size: 15px; cursor: pointer; }  /* ← regression 1 */
    table { width: calc(100% - 48px); margin: 0 24px 24px; border-collapse: collapse; background: #fff; }
    th, td { border: 1px solid #e2e6ee; padding: 8px 12px; text-align: left; font-size: 14px; }
    th { background: #eef2f9; }
  </style>
</head>
<body>
  <header><h1>Sales Dashboard</h1><span>Acme Inc.</span></header>

  <div class="container">
    <div class="card"><h2>Revenue</h2><div class="value">$12,480</div></div>
    <div class="card"><h2>Orders</h2><div class="value">312</div></div>
    <div class="card"><h2>Customers</h2><div class="value">1,204</div></div>
  </div>

  <div class="cta"><button type="button">Export report</button></div>

  <table>
    <caption style="text-align:left; margin-bottom:8px; font-weight:bold;">Recent orders</caption>
    <thead><tr><th>Order</th><th>Customer</th><th>Total</th></tr></thead>
    <tbody>
      <tr><td>#1001</td><td>Ann Tester</td><td>$120.00</td></tr>
      <tr><td>#1002</td><td>Bob Builder</td><td>$75.50</td></tr>
      <tr><td>#1003</td><td>Cara Coder</td><td>$310.00</td></tr>
    </tbody>
  </table>
</body>
</html>
