# A complete test pipeline: fast feedback first, expensive tests later, gates before deploy.
name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:

concurrency: # cancel older runs of the same branch to save minutes
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  # ── Stage 1: seconds ────────────────────────────────────────────────────────
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run test:unit -- --coverage
      - name: Enforce coverage threshold
        run: npx vitest run --coverage.thresholds.lines=80

  # ── Stage 2: minutes, only if stage 1 passed ────────────────────────────────
  integration-tests:
    needs: [lint-and-typecheck, unit-tests]
    runs-on: ubuntu-latest
    services: # real dependencies as containers
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: test, POSTGRES_DB: testdb }
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgres://postgres:test@localhost:5432/testdb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run migrate
      - run: npm run test:integration

  contract-tests:
    needs: [unit-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run test:consumer
      - name: Publish pact to the broker
        run: npx pact-broker publish ./pacts --consumer-app-version=${{ github.sha }} --branch=${{ github.ref_name }}
        env:
          PACT_BROKER_BASE_URL: ${{ secrets.PACT_BROKER_URL }}
          PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}

  # ── Stage 3: expensive, runs against a deployed environment ─────────────────
  e2e-tests:
    needs: [integration-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npm run test:e2e
        env:
          BASE_URL: ${{ secrets.STAGING_URL }}
          TEST_USER: ${{ secrets.TEST_USER }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }} # ⭐ secrets, never hardcoded
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: playwright-report, path: playwright-report/ }

  accessibility:
    needs: [integration-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:a11y

  # ── Stage 4: the gate ───────────────────────────────────────────────────────
  deploy:
    needs: [e2e-tests, contract-tests, accessibility]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production # GitHub environment: can require manual approval
    steps:
      - uses: actions/checkout@v4
      - name: Can I deploy? (contract check)
        run: npx pact-broker can-i-deploy --pacticipant web-app --version ${{ github.sha }} --to-environment production
        env:
          PACT_BROKER_BASE_URL: ${{ secrets.PACT_BROKER_URL }}
      - name: Deploy
        run: ./scripts/deploy.sh
      - name: Smoke test production
        run: npm run test:smoke
        env: { BASE_URL: https://app.example.com }
      - name: Roll back if smoke tests failed
        if: failure()
        run: ./scripts/rollback.sh
